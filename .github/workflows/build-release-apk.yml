name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.3
    
    - name: Install Android SDK
      run: |
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools/latest
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
        
        echo "y" | sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null 2>&1 || true
        sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1
    
    - name: Install NDK
      run: |
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
        sdkmanager --sdk_root=$ANDROID_HOME "ndk;26.2.11394342" > /dev/null 2>&1
    
    - name: Install CMake
      run: |
        export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
        sdkmanager --sdk_root=$ANDROID_HOME "cmake;3.22.1" > /dev/null 2>&1
    
    - name: Set environment variables
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.2.11394342" >> $GITHUB_ENV
        echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV
    
    - name: Generate Gradle Wrapper
      run: |
        cd LiveMicBT
        gradle wrapper --gradle-version 8.3
    
    - name: Build Release APK
      run: |
        cd LiveMicBT
        chmod +x gradlew
        ./gradlew assembleRelease
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LiveMicBT-Release-APK
        path: LiveMicBT/app/build/outputs/apk/release/*.apk
        retention-days: 30
