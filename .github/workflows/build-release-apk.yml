name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK and NDK
      uses: nttld/setup-android@v1
      with:
        ndk-version: 26.2.11394342
        sdk-platforms: android-34
        build-tools: 34.0.0
        cmake: true
        accept-licenses: yes
    
    - name: Accept all SDK licenses
      run: yes | sdkmanager --licenses > /dev/null 2>&1 || true
    
    - name: Build Release APK
      run: |
        cd LiveMicBT
        chmod +x gradlew
        ./gradlew assembleRelease
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: LiveMicBT-Release-APK
        path: LiveMicBT/app/build/outputs/apk/release/*.apk
        retention-days: 30
